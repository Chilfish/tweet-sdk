name: Bug report
description: Report a reproducible defect
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please confirm that you have searched existing issues, read docs/README.md, and tried the latest version.
        For security issues, follow SECURITY.md instead of posting them publicly here.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Please include the full error output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps, code, or a link to a minimal repository.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, package manager and its version.
    validations:
      required: true
