name: Feature request
description: Suggest a new feature or an improvement
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please start with the use case. The scaffold keeps zero runtime dependencies by default, so adding a dependency needs a strong justification.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation did you hit? How are you working around it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you want, with example code.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, and why you rejected them.
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I understand that a new runtime dependency requires extra justification
          required: true
