name: 功能请求
description: 提出新功能或改进建议
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景。脚手架默认保持零运行时依赖，新增依赖需要充分理由。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么限制？现在如何绕过？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的 API 或行为，附示例代码。
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，以及为什么不用。
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，没有重复建议
          required: true
        - label: 我理解新增运行时依赖需要额外论证
          required: true
