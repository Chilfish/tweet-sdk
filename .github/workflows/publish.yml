name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # OIDC publishing stays disabled until the npm package exists and its Trusted
    # Publisher is configured. Enable it by setting the repository variable
    # NPM_OIDC_READY=true; until then a tag push only runs CI, and publishing is
    # done manually from the maintainer's machine.
    if: vars.NPM_OIDC_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Do not set registry-url: authentication exchanges a short-lived credential via
          # npm Trusted Publisher (OIDC), and registry-url would write an .npmrc with a
          # placeholder token that actually interferes with OIDC.

      - name: Upgrade npm for Trusted Publisher
        # npm 11.5.2+ supports OIDC trusted publishing. Pin the major line: npm 12
        # changed `pack --json` output, and a stable publisher is easier to audit.
        run: npm install -g npm@11

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: bun run verify:tag "${{ github.ref_name }}"

      - name: Verify CHANGELOG entry
        run: |
          pkg="$(node -p "require('./package.json').version")"
          grep -q "^## $pkg" CHANGELOG.md

      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run test
      - run: bun run build
      - run: bun run verify:package
      - run: bun run check:docs

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Verify registry
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if npm view "$pkg@$version" version; then
              exit 0
            fi
            echo "registry not yet installable (attempt $attempt), retrying in 10s"
            sleep 10
          done
          echo "registry did not serve $pkg@$version within 300s"
          exit 1
