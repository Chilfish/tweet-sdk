name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # 不设置 registry-url：认证通过 npm Trusted Publisher (OIDC) 交换短期凭据，
          # registry-url 会写入带占位 token 的 .npmrc，反而干扰 OIDC。

      - name: Upgrade npm for Trusted Publisher
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: bun run verify:tag "${{ github.ref_name }}"

      - name: Verify CHANGELOG entry
        run: |
          pkg="$(node -p "require('./package.json').version")"
          grep -q "^## $pkg" CHANGELOG.md

      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run test
      - run: bun run build
      - run: bun run verify:package
      - run: bun run check:docs

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Verify registry
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if npm view "$pkg@$version" version; then
              exit 0
            fi
            echo "registry 尚未可安装（第 $attempt 次），10s 后重试"
            sleep 10
          done
          echo "registry 在 300s 内没有出现 $pkg@$version"
          exit 1
