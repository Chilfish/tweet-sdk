name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run verify:package
      - run: bun run check:docs
      - run: bun run example

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts
          test -f dist/node.js
          test -f dist/node.cjs
          test -f dist/node.d.ts
          test -f dist/node.d.cts
          test -f dist/cli.js
          test -f dist/cli.cjs
          test -f dist/cli.d.ts
          test -f dist/cli.d.cts
          test -f dist/cli-bin.js

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  runtime:
    name: Runtime Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is the lower bound of engines.node; the build tooling requires Node >=22,
        # so here we only verify that the built artifacts import correctly on each target Node.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Resolve the runtime dependencies referenced by the dist artifact
      # (linkedom, x-client-transaction-id); skip prepare scripts because the
      # production install does not include lefthook.
      - run: bun install --frozen-lockfile --production --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Import ESM build
        run: node --input-type=module -e "const m = await import('./dist/index.js'); if (typeof m.TwitterClient !== 'function' || !m.ResourceType) process.exit(1); const n = await import('./dist/node.js'); if (typeof n.createNodeClient !== 'function') process.exit(1); const c = await import('./dist/cli.js'); if (typeof c.main !== 'object') process.exit(1)"

      - name: Import CJS build
        run: node -e "const m = require('./dist/index.cjs'); if (typeof m.TwitterClient !== 'function' || !m.ResourceType) process.exit(1); const n = require('./dist/node.cjs'); if (typeof n.createNodeClient !== 'function') process.exit(1); const c = require('./dist/cli.cjs'); if (typeof c.main !== 'object') process.exit(1)"

      - name: CLI smoke
        run: node dist/cli-bin.js --version
